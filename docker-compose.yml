version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rad-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: rad_db
      POSTGRES_USER: rad_user
      POSTGRES_PASSWORD: rad_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
    driver: local
